<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../templates/katex/katex.min.css">
<script src="../templates/katex/katex.min.js"></script>
<script src="../templates/katex/auto-render.min.js"></script>
<script>
window.onload = function() {
    renderMathInElement(document.body, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false
    });
};
</script>
</head>
<body>
<p>Test 1: <span dir="ltr">$x < y$</span></p>
<p>Test 2: <span dir="ltr">$x &lt; y$</span></p>
<div dir="ltr">$$\begin{matrix} a & b \\ c & d \end{matrix}$$</div>
</body>
</html>
